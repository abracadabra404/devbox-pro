name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.label }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Windows x64
            os: windows-latest
            package-script: pnpm exec electron-builder --win nsis --x64 --publish never
            artifact-name: devbox-pro-windows-x64
            artifact-path: |
              release/*.exe
              release/*.blockmap
          - label: macOS universal
            os: macos-latest
            package-script: pnpm exec electron-builder --mac dmg zip --universal --publish never
            artifact-name: devbox-pro-macos-universal
            artifact-path: |
              release/*.dmg
              release/*.zip
              release/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict check
        run: pnpm lint

      - name: Build bundles
        run: pnpm build

      - name: Package installer
        run: ${{ matrix.platform.package-script }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact-name }}
          path: ${{ matrix.platform.artifact-path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/**/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DevBox Pro $TAG_NAME" \
            --notes "Alpha installer build for DevBox Pro phase 1 MVP validation. These packages are unsigned and intended for internal testing."
